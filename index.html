<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>countdown_19</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="countdown">
      <div class="loader">
        <div class="loader__spinner"></div>
      </div>

      <div class="countdown__desktop">
        <p class="targetDate__desktop-text">strada.one</p>
      </div>
      <div class="group">
        <form class="form">
          <p class="form__label">введите дату</p>
          <div class="form__input">
            <div class="input">
              <input
                class="input__text"
                type="text"
                placeholder="DDMMYYYY"
                autofocus
              />

              <img
                class="form__input-img"
                src="./img/calendar.svg"
                alt="картинка календаря"
              />
            </div>
            <button class="form__form-button" type="submit">
              <p class="form__form-button-text">посчитать</p>
            </button>
          </div>
        </form>
        <div class="data">
          <div class="data__text">Осталось времени:</div>
          <div class="data__result"></div>
        </div>
      </div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
